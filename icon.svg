<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Wichita Guild, Chapter Zero: a Meckie faceplate in the warm dark of Ziggy's,
       with the cold data-center cyan carried in the eyes. -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#171310"/>
  <!-- cold window light falling across the room -->
  <polygon points="88,0 104,0 64,128 48,128" fill="#00d4ff" opacity="0.10"/>
  <!-- faceplate -->
  <rect x="24" y="38" width="80" height="52" rx="16" fill="#241c18" stroke="#ffb454" stroke-width="4"/>
  <!-- eyes -->
  <circle cx="50" cy="64" r="9" fill="#00d4ff"/>
  <circle cx="78" cy="64" r="9" fill="#00d4ff"/>
  <!-- antenna nub -->
  <rect x="60" y="26" width="8" height="10" rx="3" fill="#ffb454"/>
  <!-- bar counter line -->
  <rect x="24" y="100" width="80" height="5" rx="2.5" fill="#ffb454" opacity="0.55"/>
</svg>
